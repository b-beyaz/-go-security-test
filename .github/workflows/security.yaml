name: Security Scanning

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    # Weekly scan to catch newly disclosed CVEs even without code changes
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Set to "true" once a container registry/production publish pipeline exists
  # for this project. While "false", Trivy findings are reported but never fail
  # the job.
  ENFORCE_CONTAINER_SCAN: "false"

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  gosec:
    name: Run gosec
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run gosec
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 \
            -no-fail \
            -fmt json \
            ./... | tee gosec-report.json

      - name: Upload gosec report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gosec-report
          path: gosec-report.json
          retention-days: 30

  owasp-dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "NVD_API_KEY is EMPTY"
            exit 1
          fi

          echo "NVD_API_KEY is configured"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -o pipefail

          mkdir -p reports

          docker run --rm \
            --volume "${{ github.workspace }}:/src:z" \
            owasp/dependency-check:13.0.0 \
            --scan /src \
            --format HTML \
            --project "thyris-sz" \
            --out /src/reports \
            --nvdApiKey "$NVD_API_KEY" \
            --verbose \
            2>&1 | tee reports/dependency-check.log      

      - name: Debug Dependency-Check reports
        if: always()
        run: |
          echo "=== reports directory ==="
          ls -lah reports/ || true

          echo "=== dependency-check.log ==="
          cat reports/dependency-check.log || true

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-dependency-check-report
          path: reports/
          retention-days: 30

  trivy:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image for scanning
        run: docker build -t go-security-test:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: go-security-test:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          # Controlled by the ENFORCE_CONTAINER_SCAN env var.
          # Defaults to report-only while there is no
          # container registry/production pipeline.
          exit-code: ${{ env.ENFORCE_CONTAINER_SCAN == 'true' && '1' || '0' }}
          output: trivy-report.txt

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 30