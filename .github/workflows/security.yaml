name: Security Scanning

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    # Weekly scan to catch newly disclosed CVEs even without code changes
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Set to "true" once a container registry/production publish pipeline exists
  # for this project. While "false", Trivy findings are reported but never fail
  # the job. This is a plain in-repo toggle (not a repository Variable) so any
  # contributor can see/change it via a normal PR, without needing repo Settings
  # ("Manage Actions variables") write access.
  ENFORCE_CONTAINER_SCAN: "false"

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        # continue-on-error: this job makes findings visible without blocking
        # merges on pre-existing issues in application code, which is out of
        # scope for this PR.
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  gosec:
    name: Run gosec
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run gosec
        # continue-on-error: same rationale as govulncheck above — this job
        # makes findings visible without blocking merges on pre-existing
        # issues in application code, which is out of scope for this PR.
        continue-on-error: true
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -no-fail -conf .gosec -fmt json ./... | tee gosec-report.json

      - name: Upload gosec report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gosec-report
          path: gosec-report.json
          retention-days: 30

  owasp-dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache OWASP Dependency-Check NVD database
        uses: actions/cache@v4
        with:
          path: ~/.owasp-dc-data
          key: owasp-dc-data-${{ github.run_id }}
          restore-keys: |
            owasp-dc-data-

      - name: Run OWASP Dependency-Check
        # continue-on-error: same rationale as govulncheck/gosec above — this
        # job makes findings visible without blocking merges on pre-existing
        # issues, which is out of scope for this PR. Also, without an
        # NVD_API_KEY secret configured, NVD database sync can be slow on
        # first run; maintainers can add that secret later to speed this up
        # (free key from https://nvd.nist.gov/developers/request-an-api-key).
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p reports ~/.owasp-dc-data
          docker run --rm \
            -u $(id -u):$(id -g) \
            --volume "${{ github.workspace }}:/src:z" \
            --volume "$HOME/.owasp-dc-data:/usr/share/dependency-check/data:z" \
            owasp/dependency-check:13.0.0 \
            --scan /src \
            --format ALL \
            --project "go-security-test" \
            --out /src/reports \
            ${NVD_API_KEY:+--nvdApiKey "$NVD_API_KEY"}

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-dependency-check-report
          path: reports/
          retention-days: 30

  trivy:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image for scanning
        run: docker build -t go-security-test:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: go-security-test:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-report.txt
          # Controlled by the ENFORCE_CONTAINER_SCAN env var declared at the top of
          # this file. Defaults to report-only ("0") while the project has no
          # container registry/production pipeline yet.
          exit-code: ${{ env.ENFORCE_CONTAINER_SCAN == 'true' && '1' || '0' }}

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 30