name: Security Scanning

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ENFORCE_CONTAINER_SCAN: "false"
  DC_VERSION: "12.1.0"

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Generate govulncheck SARIF report
        continue-on-error: true
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 \
            -format sarif ./... > govulncheck-report.sarif || true

      - name: Upload govulncheck SARIF to Security tab
        continue-on-error: true
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: govulncheck-report.sarif
          category: govulncheck

      - name: Upload govulncheck report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: govulncheck-report
          path: govulncheck-report.sarif
          retention-days: 30

  gosec:
    name: Run gosec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run gosec
        continue-on-error: true
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 \
            -no-fail -conf .gosec \
            -fmt=json -out=gosec-report.json \
            -fmt=sarif -out=gosec-report.sarif \
            ./...

      - name: Upload gosec SARIF to Security tab
        continue-on-error: true
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec-report.sarif
          category: gosec

      - name: Upload gosec report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gosec-report
          path: gosec-report.sarif
          retention-days: 30

  owasp-dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache OWASP Dependency-Check NVD database
        uses: actions/cache@v4
        with:
          path: ~/.owasp-dc-data
          key: owasp-dc-data-${{ github.run_id }}
          restore-keys: |
            owasp-dc-data-

      - name: Download OWASP Dependency-Check
        run: |
          set -euo pipefail
          ASSET_NAME="dependency-check-${DC_VERSION}-release.zip"
          DOWNLOAD_URL="https://github.com/jeremylong/DependencyCheck/releases/download/v${DC_VERSION}/${ASSET_NAME}"

          mkdir -p "${RUNNER_TEMP}/dependency-check-cli"
          curl -sSfL -o "${RUNNER_TEMP}/dc.zip" "$DOWNLOAD_URL"

          ASSET_ID=$(curl -sSf \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/jeremylong/DependencyCheck/releases/tags/v${DC_VERSION}" \
            | jq -r --arg name "$ASSET_NAME" '.assets[] | select(.name==$name) | .id')

          if [ -n "${ASSET_ID}" ] && [ "${ASSET_ID}" != "null" ]; then
            EXPECTED_DIGEST=$(curl -sSf \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/jeremylong/DependencyCheck/releases/assets/${ASSET_ID}" \
              | jq -r '.digest // empty')

            if [ -n "${EXPECTED_DIGEST}" ]; then
              ACTUAL_DIGEST="sha256:$(sha256sum "${RUNNER_TEMP}/dc.zip" | cut -d' ' -f1)"
              if [ "${EXPECTED_DIGEST}" != "${ACTUAL_DIGEST}" ]; then
                echo "::error::Checksum mismatch for ${ASSET_NAME}: expected ${EXPECTED_DIGEST}, got ${ACTUAL_DIGEST}"
                exit 1
              fi
              echo "Checksum verified: ${ACTUAL_DIGEST}"
            else
              echo "::warning::GitHub API returned no digest for this asset; skipping integrity check"
            fi
          else
            echo "::warning::Could not resolve asset id for ${ASSET_NAME}; skipping integrity check"
          fi

          unzip -q "${RUNNER_TEMP}/dc.zip" -d "${RUNNER_TEMP}/dependency-check-cli"

      - name: Run OWASP Dependency-Check
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p reports ~/.owasp-dc-data
          "${RUNNER_TEMP}/dependency-check-cli/dependency-check/bin/dependency-check.sh" \
            --enableExperimental \
            --disableOssIndex \
            --exclude "**/.git/**" \
            --scan . \
            --format ALL \
            --project "go-security-test" \
            --out reports \
            --data ~/.owasp-dc-data \
            ${NVD_API_KEY:+--nvdApiKey "$NVD_API_KEY"}

      - name: Upload Dependency-Check SARIF to Security tab
        continue-on-error: true
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-dependency-check-report
          path: reports/
          retention-days: 30

  trivy:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image for scanning
        run: docker build -t go-security-test:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: go-security-test:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-report.txt
          exit-code: ${{ env.ENFORCE_CONTAINER_SCAN == 'true' && '1' || '0' }}

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 30